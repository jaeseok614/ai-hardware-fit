name: Benchmark report
description: 실제 실행 결과를 제보합니다. scripts/benchmark-cli.mjs로 측정했다면 출력된 JSON을 그대로 붙여넣어도 됩니다.
title: "[Benchmark] "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        `node scripts/benchmark-cli.mjs --runtime ollama --model <모델> --context <길이>` (llama.cpp는 `--runtime llamacpp`)로 실행하면
        아래 JSON 칸에 그대로 붙여넣을 수 있는 결과가 출력됩니다. 구조화된 처리량 데이터는 현재 LLM(tok/s), 임베딩(doc/s), 리랭커(pair/s), OCR(page/s)를 지원합니다.
        **CLI JSON 또는 아래 수동 입력 항목 중 한쪽**을 채워 주세요.
  - type: textarea
    id: cli_json
    attributes:
      label: CLI 측정 결과 (JSON)
      description: scripts/benchmark-cli.mjs 출력의 JSON 블록을 그대로 붙여넣어 주세요. CLI JSON을 넣었다면 아래 수동 항목은 비워도 됩니다.
      render: json
    validations:
      required: false
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: RTX 4090 24GB
    validations:
      required: false
  - type: input
    id: gpu_id
    attributes:
      label: 사이트 GPU ID
      description: 사이트 URL의 gpu= 값 또는 data/gpus.js의 id를 적으면 자동 집계가 정확해집니다.
      placeholder: rtx4090-24
  - type: dropdown
    id: workload
    attributes:
      label: 워크로드
      options:
        - Generative LLM (tok/s)
        - Embedding (doc/s)
        - Reranker (pair/s)
        - OCR / document processing (page/s)
      default: 1
  - type: input
    id: model
    attributes:
      label: 모델
      placeholder: Qwen2.5 32B Instruct
    validations:
      required: false
  - type: input
    id: runtime
    attributes:
      label: 런타임
      placeholder: Ollama, llama.cpp, vLLM, Transformers, MLX(mlx-lm)
    validations:
      required: false
  - type: input
    id: os_driver
    attributes:
      label: 운영체제·드라이버
      placeholder: Ubuntu 24.04, NVIDIA 570.xx / Windows 11, Adrenalin xx
  - type: input
    id: power
    attributes:
      label: 전력 제한·노트북 TGP
      placeholder: 450W, 120W TGP, 기본값
  - type: input
    id: peak_vram
    attributes:
      label: 최대 VRAM 사용량
      placeholder: 18.4GB
  - type: input
    id: settings
    attributes:
      label: 실행 설정
      placeholder: Q4_K_M, 8K context, concurrency 1
    validations:
      required: false
  - type: input
    id: input_tokens
    attributes:
      label: 입력·컨텍스트 토큰
      placeholder: 8192
  - type: input
    id: output_tokens
    attributes:
      label: 출력 토큰
      placeholder: 512
  - type: input
    id: concurrency
    attributes:
      label: 동시 요청
      placeholder: 1
  - type: input
    id: result
    attributes:
      label: 실제 결과
      placeholder: OOM 없음, 32 tok/s
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 로그 또는 참고 자료
      description: 가능하면 명령어, VRAM 사용량, 토큰 속도 로그를 붙여 주세요.
