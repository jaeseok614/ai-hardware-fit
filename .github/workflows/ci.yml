name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:catalog

  calculations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run calculation test batch ${{ matrix.batch }}
        run: node scripts/run-tests.mjs --batch=${{ matrix.batch }}

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1 axe-core@4.10.3 @lhci/cli@0.15.1
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_path"
          "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npm run test:visual
      - name: Lighthouse budgets
        run: npx lhci autorun
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-regression-screenshots
          path: outputs/ui-regression
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: outputs/lighthouse
